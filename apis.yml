aid: lessen
name: Lessen
description: 'Lessen is a Scottsdale, Arizona based property services and facilities
  management technology company that connects commercial and residential property
  owners and managers with a nationwide network of vetted service providers for
  repairs, maintenance, turns, make-readies and capital projects. The company operates
  a technology platform stack — One by Lessen for work-order, vendor-sourcing and
  invoicing workflow, Lessen 360 for multifamily maintenance, Lessen Pro for affiliate
  contractors, Aiden for AI-assisted work-order creation, and the Lessen Marketplace
  for procurement — supported by mobile apps for tenants, property managers and
  vendors. Lessen serves retail, financial services, healthcare, food service,
  industrial, hospitality and education properties alongside single-family and
  multifamily residential portfolios. Lessen acquired SMS Assist in 2023 and is
  backed by Fifth Wall and General Catalyst. Lessen publishes no public developer
  portal, API reference or OpenAPI definition; its named platform integrations are
  delivered as private partner connections rather than a self-serve API program.'
